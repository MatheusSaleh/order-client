server:
  port: ${HTTP_PORT:8080}
  # Usa X-Forwarded-Host/Proto do nginx (o order-client so e alcancavel pela rede interna)
  forward-headers-strategy: framework

spring:
  application:
    name: order-client
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  grpc:
    client:
      channel:
        order-service:
          # Porta gRPC do order-server (a 8081 e a porta HTTP/actuator).
          # Texto puro: o trafego fica restrito a rede interna do Docker.
          target: static://${ORDER_SERVER_GRPC_ADDRESS:localhost:9090}
  mvc:
    problemdetails:
      enabled: true

order:
  queue: ${ORDER_QUEUE:pedidos_fila}
  worker-url: ${ORDER_WORKER_URL:http://localhost:8082}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  sse:
    max-connections: ${SSE_MAX_CONNECTIONS:200}
  simulation:
    # false = desliga rajadas, controle do worker e redrive (os endpoints deixam de existir)
    enabled: ${SIMULATION_ENABLED:true}
    max-burst: ${SIMULATION_MAX_BURST:50}
    # Pedidos simulados em andamento ao mesmo tempo, somando todos os visitantes
    max-in-flight: ${SIMULATION_MAX_IN_FLIGHT:150}
    # Worker desligado ou com falhas volta ao normal sozinho depois desse tempo (0 = nunca)
    auto-reset-seconds: ${SIMULATION_AUTO_RESET_SECONDS:180}
    default-processing-delay-ms: ${WORKER_PROCESSING_DELAY_MS:1200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
